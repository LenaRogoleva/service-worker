<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    @keyframes spinner {
        0% {
            transform: scale(.1) rotate(0deg);
            fill: currentColor;
        }

        33% {
            transform: scale(1) rotate(150deg);
            fill: transparent;
        }

        66% {
            transform: scale(1) rotate(210deg);
            fill: transparent;
        }

        100% {
            transform: scale(.1) rotate(360deg);
            fill: currentColor;
        }
    }

    .spinner {
        animation: spinner 1.5s infinite linear;
        color: rgb(6, 75, 67);
    }

    .button {
        padding: 10px 24px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;

        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 20px;
        transition: background-color 0.2s ease;
    }

    .button-start {
        background-color: rgb(6, 75, 67);

        &:hover {
            background-color: rgb(9, 104, 93);
        }

        &:active {
            background-color: rgb(4, 54, 48);
        }
    }

    .button-unregister {
        background-color: rgb(86, 104, 232);

        &:hover {
            background-color: rgb(109, 128, 246);
        }

        &:active {
            background-color: rgb(56, 70, 184);
        }
    }
</style>
<body>
<button id="start-button" class="button button-start">Start!</button>
<button id="unregister-button" class="button button-unregister">Unregister Service Worker</button>
<div>
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" fill="none" class="spinner"><path stroke="currentColor" stroke-width="4" d="M3.464 30a4 4 0 0 1 0-4L16 4.287a4 4 0 0 1 3.464-2h25.072a4 4 0 0 1 3.464 2L60.536 26a4 4 0 0 1 0 4L48 51.713a4 4 0 0 1-3.464 2H19.464a4 4 0 0 1-3.464-2L3.464 30Z"/></svg>
</div>
<div id="result"></div>
</body>

<script src="./contract.js"></script>
<script>
    const TIMEOUT = 2000;

    const startButton = document.getElementById('start-button');
    const unregisterButton = document.getElementById('unregister-button');
    const resultElement = document.getElementById('result');

    /** @type {ServiceWorkerRegistration | null} */
    let registration = null;

    const showText = (text) => {
        resultElement.textContent = text;
    };

    // navigator.serviceWorker.ready резолвится один раз, поэтому после повторной регистрации
    // ждём активации воркера у конкретной registration
    const waitForActive = (registration) => new Promise((resolve, reject) => {
        if (registration.active) {
            resolve(registration.active);
            return;
        }
        const worker = registration.installing || registration.waiting;
        worker.addEventListener('statechange', () => {
            if (worker.state === 'activated') {
                resolve(worker);
            } else if (worker.state === 'redundant') {
                reject(new Error('Service Worker не удалось активировать'));
            }
        });
    });

    const register = async () => {
        if (!('serviceWorker' in navigator)) {
            throw new Error('Service Worker не поддерживается браузером');
        }
        const newRegistration = await navigator.serviceWorker.register('./thread.js', { scope: './' });
        await waitForActive(newRegistration);
        return newRegistration;
    };

    const sendCommand = async (name) => {
        startButton.disabled = true;
        showText('Считаем...');
        try {
            if (!registration) {
                registration = await register();
            }
            registration.active.postMessage({ name, data: { timeout: TIMEOUT } });
        } catch (error) {
            startButton.disabled = false;
            showText(`Ошибка: ${error.message}`);
        }
    };

    navigator.serviceWorker?.addEventListener('message', (event) => {
        const { name, data } = event.data;
        if (name === Responses.RESULT) {
            showText(`${data.value}${data.fromCache ? ' (из кеша)' : ''}`);
        } else if (name === Responses.ERROR) {
            showText(`Ошибка: ${data.message}`);
        }
        startButton.disabled = false;
    });

    unregisterButton.addEventListener('click', async () => {
        if (!registration) {
            showText('Service Worker не зарегистрирован');
            return;
        }
        try {
            await caches.delete(CACHE_NAME);
            await registration.unregister();
            registration = null;
            showText('Service Worker удалён. Нажмите Start!, чтобы зарегистрировать его заново');
        } catch (error) {
            showText(`Ошибка: ${error.message}`);
        }
    });

    startButton.addEventListener('click', () => sendCommand(Commands.RECALCULATE));

    sendCommand(Commands.START);
</script>
</html>
